{% extends "base.html" %}
{% block title %}Neues Ticket{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-body">
                <h4 class="mb-3"><i class="bi bi-plus-circle"></i> Neues Ticket</h4>
                <form method="post">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label">Art</label>
                        <select name="kind" class="form-select" required>
                            <option value="DEMAND">Neue Anfrage (Demande)</option>
                            <option value="CHANGE">Änderung / Austausch (Changement)</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Priorität</label>
                        <select name="priority" class="form-select">
                            <option value="NIEDRIG">Niedrig</option>
                            <option value="MITTEL" selected>Mittel</option>
                            <option value="HOCH">Hoch</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Gerätetyp</label>
                        <select name="equipment_type" class="form-select" required>
                            <option>Laptop</option>
                            <option>PC</option>
                            <option>Smartphone</option>
                            <option>Drucker</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Beschreibung</label>
                        <textarea name="description" class="form-control" rows="3"></textarea>
                    </div>
                    <button class="btn btn-success">Ticket erstellen</button>
                    <a class="btn btn-link" href="/dashboard">Abbrechen</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
