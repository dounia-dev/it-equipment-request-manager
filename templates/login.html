{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block nav %}{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height: 90vh;">
    <div style="width: 100%; max-width: 400px;">
        <div class="text-center mb-4">
            <i class="bi bi-pc-display-horizontal text-success" style="font-size: 3rem;"></i>
            <h3 class="mt-2">IT Equipment Request Manager</h3>
            <p class="text-muted">Bitte melden Sie sich an</p>
        </div>
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <form method="post">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label">Matricule</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input name="matricule" class="form-control" required autofocus>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Passwort</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input name="password" type="password" class="form-control" required>
                        </div>
                    </div>
                    <button class="btn btn-success w-100">Anmelden</button>
                </form>
            </div>
        </div>
        <p class="text-center text-muted small mt-3">
            Demo: U001 / user123 &middot; A001 / admin123 &middot; S001 / supplier123
        </p>
    </div>
</div>
{% endblock %}
